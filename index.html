<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexkit - Web Utilities</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --btn-bg: #f1f5f9;
      --btn-hover: #e2e8f0;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .container { max-width: 600px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    .input-field {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .btn {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn-accent { background: var(--primary); color: #fff; border: none; }
    .nav-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }
    .tab-btn {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      direction: ltr !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h1 style="margin: 0; font-size: 24px;">Nexkit</h1>
    </div>

    <!-- Nav Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('calc', this)">ماشین حساب</button>
      <button class="tab-btn" onclick="switchTab('json', this)">ابزار JSON</button>
      <button class="tab-btn" onclick="switchTab('diff', this)">مقایسه متن</button>
      <button class="tab-btn" onclick="switchTab('case', this)">فرمت حروف</button>
      <button class="tab-btn" onclick="switchTab('pass', this)">رمز عبور</button>
      <button class="tab-btn" onclick="switchTab('base64', this)">Base64</button>
      <button class="tab-btn" onclick="switchTab('bmi', this)">BMI</button>
      <button class="tab-btn" onclick="switchTab('color', this)">مبدل رنگ</button>
      <button class="tab-btn" onclick="switchTab('aspect', this)">نسبت تصویر</button>
    </div>

    <!-- Top Ad -->
    <div style="text-align: center; margin-bottom: 16px; padding: 15px; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 8px;">
      <span style="font-size: 12px; color: #888;">Advertisement Space (Responsive)</span>
    </div>

    <!-- 1. Calculator -->
    <div class="card tool-card" id="tab-calc">
      <h3>Calculator</h3>
      <input type="text" class="input-field" id="calcDisplay" readonly style="text-align: left; font-size: 20px; font-weight: bold;">
      <div class="calc-grid">
        <button class="btn" onclick="clearCalc()">C</button>
        <button class="btn" onclick="appendCalc('/')">/</button>
        <button class="btn" onclick="appendCalc('*')">*</button>
        <button class="btn" onclick="appendCalc('-')">-</button>
        <button class="btn" onclick="appendCalc('7')">7</button>
        <button class="btn" onclick="appendCalc('8')">8</button>
        <button class="btn" onclick="appendCalc('9')">9</button>
        <button class="btn" onclick="appendCalc('+')">+</button>
        <button class="btn" onclick="appendCalc('4')">4</button>
        <button class="btn" onclick="appendCalc('5')">5</button>
        <button class="btn" onclick="appendCalc('6')">6</button>
        <button class="btn btn-accent" onclick="calculateResult()" style="grid-row: span 2;">=</button>
        <button class="btn" onclick="appendCalc('1')">1</button>
        <button class="btn" onclick="appendCalc('2')">2</button>
        <button class="btn" onclick="appendCalc('3')">3</button>
        <button class="btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
        <button class="btn" onclick="appendCalc('.')">.</button>
      </div>
    </div>

    <!-- 2. JSON -->
    <div class="card tool-card" id="tab-json" style="display:none;">
      <h3>JSON Tools</h3>
      <textarea class="input-field" id="jsonInput" placeholder="JSON را وارد کنید..." style="min-height: 100px;"></textarea>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <button class="btn btn-accent" onclick="formatJSON()" style="flex: 1;">Format</button>
        <button class="btn" onclick="minifyJSON()" style="flex: 1;">Minify</button>
      </div>
      <textarea class="input-field" id="jsonOutput" readonly placeholder="نتیجه..." style="min-height: 100px;"></textarea>
    </div>

    <!-- 3. Diff -->
    <div class="card tool-card" id="tab-diff" style="display:none;">
      <h3>Text Diff</h3>
      <textarea class="input-field" id="text1" placeholder="متن اول..."></textarea>
      <textarea class="input-field" id="text2" placeholder="متن دوم..."></textarea>
      <button class="btn btn-accent" onclick="compareTexts()" style="width:100%; margin-bottom: 10px;">مقایسه</button>
      <div id="diffResult" style="background: var(--bg); padding: 10px; border-radius: 8px;"></div>
    </div>

    <!-- 4. Case Converter -->
    <div class="card tool-card" id="tab-case" style="display:none;">
      <h3>Case Converter</h3>
      <textarea class="input-field" id="caseInput" placeholder="متن را وارد کنید..." oninput="updateTextStats('caseInput', 'caseStats')"></textarea>
      <div id="caseStats" style="font-size: 12px; color: #666; margin-bottom: 8px;">Words: 0 | Chars: 0 | Lines: 0</div>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <button class="btn" onclick="convertCase('upper')">UPPERCASE</button>
        <button class="btn" onclick="convertCase('lower')">lowercase</button>
        <button class="btn" onclick="convertCase('title')">Title Case</button>
      </div>
      <button class="btn" onclick="clearField('caseInput', 'caseStats')">🗑️ Clear</button>
    </div>

    <!-- 5. Password Generator -->
    <div class="card tool-card" id="tab-pass" style="display:none;">
      <h3>Password Generator</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <input type="number" id="passLength" class="input-field" value="12" style="width: 80px; margin:0;">
        <button class="btn btn-accent" onclick="generatePassword()" style="flex:1;">تولید رمز</button>
      </div>
      <input type="text" id="passOutput" class="input-field" readonly>
    </div>

    <!-- 6. Base64 -->
    <div class="card tool-card" id="tab-base64" style="display:none;">
      <h3>Base64</h3>
      <textarea class="input-field" id="cryptoInput" placeholder="متن..."></textarea>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <button class="btn btn-accent" onclick="processBase64('encode')" style="flex: 1;">Encode</button>
        <button class="btn" onclick="processBase64('decode')" style="flex: 1;">Decode</button>
      </div>
      <div id="cryptoOutput" style="background: var(--bg); padding: 10px; border-radius: 8px; word-break: break-all;"></div>
    </div>

    <!-- 7. BMI -->
    <div class="card tool-card" id="tab-bmi" style="display:none;">
      <h3>BMI Calculator</h3>
      <input type="number" id="bmiWeight" class="input-field" placeholder="وزن (کیلوگرم)">
      <input type="number" id="bmiHeight" class="input-field" placeholder="قد (سانتی‌متر)">
      <button class="btn btn-accent" onclick="calculateBMI()" style="width: 100%; margin-bottom: 10px;">محاسبه BMI</button>
      <div id="bmiResult" style="background: var(--bg); padding: 10px; border-radius: 8px;"></div>
    </div>

    <!-- 8. Color Converter -->
    <div class="card tool-card" id="tab-color" style="display:none;">
      <h3>Color Converter</h3>
      <input type="color" id="colorPicker" value="#2563eb" oninput="convertColor(this.value)" style="width: 50px; height: 40px; cursor: pointer;">
      <div id="colorResult" style="background: var(--bg); padding: 10px; border-radius: 8px; margin-top: 10px;">HEX: #2563EB | RGB: rgb(37, 99, 235)</div>
    </div>

    <!-- 9. Aspect Ratio -->
    <div class="card tool-card" id="tab-aspect" style="display:none;">
      <h3>Aspect Ratio Calculator</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="number" id="arW1" class="input-field" value="1920" style="margin:0;">
        <span>:</span>
        <input type="number" id="arH1" class="input-field" value="1080" style="margin:0;">
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="number" id="arW2" class="input-field" placeholder="عرض جدید" oninput="calcAspectRatio()" style="margin:0;">
        <span>:</span>
        <input type="number" id="arH2" class="input-field" placeholder="ارتفاع جدید" readonly style="margin:0;">
      </div>
    </div>

    <!-- Bottom Ad -->
    <div style="text-align: center; margin-top: 20px; padding: 15px; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 8px;">
      <span style="font-size: 12px; color: #888;">Advertisement Space (Footer Responsive)</span>
    </div>
  </div>

  <script src="app.logic.js"></script>
</body>
</html>
