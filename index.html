<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexKit App</title>
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #FFFFFF;
      --accent-cyan: #06B6D4;
      --accent-indigo: #6366F1;
      --border: rgba(255, 255, 255, 0.1);
    }
    [data-theme="high-contrast"] {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --accent-cyan: #0284C7;
      --accent-indigo: #4F46E5;
      --border: #CBD5E1;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      transition: all 0.3s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo { font-size: 24px; font-weight: bold; }
    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .level-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .bubble-box {
      width: 150px;
      height: 150px;
      border: 4px solid var(--accent-cyan);
      border-radius: 50%;
      margin: 15px auto;
      position: relative;
    }
    .bubble {
      width: 24px;
      height: 24px;
      background: #10B981;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.1s ease;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">NexKit</div>
    <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️ تغییر تم</button>
  </div>

  <!-- ابزار تراز دیجیتال -->
  <div class="level-container">
    <h3>📏 تراز دیجیتال</h3>
    <div class="bubble-box">
      <div class="bubble" id="bubble"></div>
    </div>
    <p id="level-info">در حال دریافت اطلاعات سنسور...</p>
    <button class="theme-btn" onclick="initSensor()">فعال‌سازی سنسور</button>
  </div>

  <h3>دسته‌بندی‌ها</h3>
  <div class="grid">
    <div class="card" style="color: var(--accent-cyan)">📏 اندازه‌گیری</div>
    <div class="card" style="color: var(--accent-indigo)">🔢 محاسبات</div>
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      if (body.getAttribute('data-theme') === 'high-contrast') {
        body.removeAttribute('data-theme');
      } else {
        body.setAttribute('data-theme', 'high-contrast');
      }
    }

    function initSensor() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation);
        document.getElementById('level-info').innerText = "سنسور فعال شد.";
      } else {
        document.getElementById('level-info').innerText = "سنسور توسط مرورگر پشتیبانی نمی‌شود.";
      }
    }

    function handleOrientation(event) {
      const x = event.gamma; // چپ و راست (-90 تا 90)
      const y = event.beta;  // جلو و عقب (-180 تا 180)

      const bubble = document.getElementById('bubble');
      const maxOffset = 60;

      let posX = Math.max(-maxOffset, Math.min(maxOffset, x));
      let posY = Math.max(-maxOffset, Math.min(maxOffset, y));

      bubble.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px))`;
      document.getElementById('level-info').innerText = `X: ${Math.round(x)}° | Y: ${Math.round(y)}°`;
    }
  </script>
</body>
</html>
