<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexKit App</title>
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #FFFFFF;
      --accent-cyan: #06B6D4;
      --accent-indigo: #6366F1;
      --border: rgba(255, 255, 255, 0.1);
    }
    [data-theme="high-contrast"] {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --accent-cyan: #0284C7;
      --accent-indigo: #4F46E5;
      --border: #CBD5E1;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      transition: all 0.3s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo { font-size: 24px; font-weight: bold; }
    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .search-box {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">NexKit</div>
    <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️ تغییر تم</button>
  </div>
  <input type="text" class="search-box" placeholder="جستجوی ابزار (تراز، محاسبه، تاریخ)...">
  
  <h3>دسته‌بندی‌های اصلی</h3>
  <div class="grid">
    <div class="card" style="color: var(--accent-cyan)">📏 اندازه‌گیری</div>
    <div class="card" style="color: var(--accent-indigo)">🔢 محاسبات</div>
    <div class="card" style="color: #A855F7">📷 هوشمند</div>
    <div class="card" style="color: #F59E0B">🚨 کاربردی</div>
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      if (body.getAttribute('data-theme') === 'high-contrast') {
        body.removeAttribute('data-theme');
      } else {
        body.setAttribute('data-theme', 'high-contrast');
      }
    }
  </script>
</body>
</html>
